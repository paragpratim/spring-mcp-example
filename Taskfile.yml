version: '3'

tasks:
  all:
    desc: Build application, build docker images, and run docker compose
    cmds:
      - task: build-backend
      - task: docker-build
      - task: docker-up
      - task: clean

  build-backend:
    desc: Maven clean install for backend
    cmds:
      - cd spring-mcp-app && ./mvnw clean install

  prepare-mcp-inspector-config:
    desc: Ensure the MCP Inspector config exists in the volume mount path
    cmds:
      - |
        mkdir -p mcp-inspector-config
        cat <<'EOF' > mcp-inspector-config/mcp.json
        {
          "mcpServers": {
            "spring-mcp": {
              "type": "streamable-http",
              "url": "http://host.docker.internal:8080/mcp"
            }
          }
        }
        EOF

  docker-build:
    desc: Build Docker images
    cmds:
      - docker-compose build

  docker-up:
    desc: Run Docker Compose
    cmds:
      - task: prepare-mcp-inspector-config
      - docker-compose up

  clean:
    desc: Clean backend and stop containers
    cmds:
      - cd spring-mcp-app && mvn clean
      - docker-compose down -v